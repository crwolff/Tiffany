name: Development Build
on:
  push:

jobs:
  BuildJammyQt5:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt and dependencies
        run: |
          sudo apt update
          sudo apt install qtbase5-dev qtbase5-dev-tools libopencv-dev libtesseract-dev

      - name: Build
        run: |
          export CC=gcc
          qmake Tiffany.pro
          make 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JammyAssetsQt5
          path: Tiffany
          retention-days: 2

  BuildJammyQt6:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt and dependencies
        run: |
          sudo apt update
          sudo apt install qt6-base-dev qt6-base-dev-tools libopencv-dev libtesseract-dev libgl-dev

      - name: Build
        run: |
          export CC=gcc
          qmake6 Tiffany.pro
          make 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JammyAssetsQt6
          path: Tiffany
          retention-days: 2

  BuildNobleQt6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt and dependencies
        run: |
          sudo apt update
          sudo apt install qt6-base-dev qt6-base-dev-tools libopencv-dev libtesseract-dev libgl-dev

      - name: Build
        run: |
          export CC=gcc
          qmake6 Tiffany.pro
          make 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NobleAssetsQt6
          path: Tiffany
          retention-days: 2

  UpdateAssets1:
    if: ${{ github.repository_owner == 'crwolff' && github.event_name == 'push' }}
    needs: BuildJammyQt5
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch artifacts
        uses: actions/download-artifact@v4

      - name: Upload Jammy latest pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "Jammy_Qt5"
          prerelease: true
          title: "Jammy Qt5 Development Build"
          files: |
            JammyAssetsQt5/Tiffany*
            LICENSE

  UpdateAssets2:
    if: ${{ github.repository_owner == 'crwolff' && github.event_name == 'push' }}
    needs: BuildJammyQt6
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch artifacts
        uses: actions/download-artifact@v4

      - name: Upload Jammy latest pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "Jammy_Qt6"
          prerelease: true
          title: "Jammy Qt6 Development Build"
          files: |
            JammyAssetsQt6/Tiffany*
            LICENSE

  UpdateAssets3:
    if: ${{ github.repository_owner == 'crwolff' && github.event_name == 'push' }}
    needs: BuildNobleQt6
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch artifacts
        uses: actions/download-artifact@v4

      - name: Upload Noble latest pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "Noble_Qt6"
          prerelease: true
          title: "Noble Qt6 Development Build"
          files: |
            NobleAssetsQt6/Tiffany*
            LICENSE
